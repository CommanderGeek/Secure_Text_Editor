<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <mat-form-field class="password-input">
    <mat-label>Password</mat-label>
    <input matInput
           [type]="hidePassword ? 'password' : 'text'"
           [(ngModel)]="password"
           placeholder="Enter your password"
           maxlength="32"
           required>
    <button mat-icon-button matSuffix (click)="togglePasswordVisibility()" [attr.aria-label]="'Toggle password visibility'">
      <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
    <button mat-icon-button matSuffix color="warn" *ngIf="password" (click)="clearPassword()">
      <mat-icon>clear</mat-icon>
    </button>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end" class="confirm">
  <button mat-button (click)="onCancel()"> Cancel</button>
  <button mat-button color="primary" (click)="onConfirm()">Confirm</button>
</mat-dialog-actions>
